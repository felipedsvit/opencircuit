[workspace]
members = [
    "crates/circuit-domain",
    "crates/circuit-diagnostics",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
circuit-domain = { path = "crates/circuit-domain" }
serde_json = "1"
