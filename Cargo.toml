[workspace]
members = [
    "apps/cli",
    "apps/desktop",
    "crates/circuit-commands",
    "crates/circuit-editor",
    "crates/circuit-export",
    "crates/circuit-model",
    "crates/circuit-project",
    "crates/circuit-renderer",
    "crates/circuit-sim",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
circuit-commands = { path = "crates/circuit-commands", version = "0.0.1" }
circuit-editor = { path = "crates/circuit-editor", version = "0.0.1" }
circuit-export = { path = "crates/circuit-export", version = "0.0.1" }
circuit-model = { path = "crates/circuit-model", version = "0.0.1" }
circuit-project = { path = "crates/circuit-project", version = "0.0.1" }
circuit-renderer = { path = "crates/circuit-renderer", version = "0.0.1" }
circuit-sim = { path = "crates/circuit-sim", version = "0.0.1" }
proptest = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
