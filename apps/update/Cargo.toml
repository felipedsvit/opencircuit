[package]
name = "opencircuit-update"
description = "The update of OpenCircuit: the latest published release, its installer for this system, and the check of its signature (ADR-0020)"
version.workspace = true
edition.workspace = true
license.workspace = true
# The command line (MSRV 1.85) depends on this crate, so it keeps that minimum.
rust-version = "1.85"
publish = false

[dependencies]
minisign-verify = "0.3.0"
# ureq uses rustls with the ring provider, and the roots of the system:
# the webpki roots are under a licence outside deny.toml (ADR-0020).
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8.5"
serde = { workspace = true }
serde_json = { workspace = true }
# sha2 0.10 keeps the MSRV of 1.85; 0.11 needs Rust 1.88.
sha2 = "0.10"
ureq = { version = "3.5.2", default-features = false, features = ["rustls-no-provider"] }
