<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpenCircuit</title>
    <!-- Trunk builds this binary for wasm32 and adds the loader that
         wasm-bindgen generates; no JavaScript is written by hand. -->
    <link data-trunk rel="rust" data-bin="opencircuit-desktop">
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #202020; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="opencircuit_canvas"></canvas>
  </body>
</html>
