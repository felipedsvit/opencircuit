[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
unused-allowed-license = "allow"
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# The default fonts of egui, without which it draws no text. The fonts are
# under the SIL Open Font License and the Ubuntu Font Licence; both allow
# redistribution with the software. Allowed for this crate only.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
